name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint Build And Test
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm lint

      - name: Install Playwright Chromium
        # No --with-deps: the browser's OS libraries are already present on the
        # GitHub-hosted ubuntu runner. --with-deps shells out to apt, which hangs
        # on the current ubuntu-24.04 image (the needrestart prompt blocks the
        # install — actions/runner-images#11347).
        run: pnpm exec playwright install --only-shell chromium

      - name: Build
        run: pnpm build

      - name: Run Browser Tests
        id: run_tests
        run: pnpm run test --reporter=json --outputFile=test-results.json
        continue-on-error: true

      - name: Detect visual regression failures
        id: vr_check
        if: steps.run_tests.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          VR_FAILED=$(jq '[
            .testResults[].assertionResults[]
            | select(.status == "failed")
            | select(any(.failureMessages[]; contains("toMatchScreenshot")))
          ] | length > 0' test-results.json)
          echo "vr_failed=$VR_FAILED" >> $GITHUB_OUTPUT
      - name: Post VR failure comment
        if: steps.vr_check.outputs.vr_failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr view ${{ github.event.pull_request.number }} \
            --json comments \
            --jq '[.comments[].body | select(contains("Visual Regression Failures Detected"))] | length')
          
          if [ "$EXISTING" -eq 0 ]; then
            gh pr comment ${{ github.event.pull_request.number }} \
              --body "### 📸 Visual Regression Failures Detected

          Some screenshots don't match the stored references. If these changes are intentional, add the \`update screenshots\` label to this PR to update them automatically."
          fi
      - name: Fail if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1

  release:
    name: Release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      deployments: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          publish: pnpm release
          createGithubReleases: true
          commit: version packages

  build-demo:
    name: Build Demo
    needs: verify
    if: "(github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build demo site
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm build:demo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy-pages:
    name: Deploy Demo To GitHub Pages
    needs: build-demo
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
