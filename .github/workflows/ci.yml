name: CI

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint Build And Test
    runs-on: ubuntu-24.04
    # Run in Playwright's official image: the browser is prebaked, so there is no
    # download from cdn.playwright.dev (which stalls intermittently on the
    # runners) and no `playwright install --with-deps` apt step (which hangs on
    # the ubuntu-24.04 needrestart prompt — actions/runner-images#11347). Keep the
    # tag in sync with the playwright version resolved in pnpm-lock.yaml.
    container:
      image: mcr.microsoft.com/playwright:v1.60.0-noble
    permissions:
      contents: read
      pull-requests: write
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Trust the workspace for git
        # The container runs as root over a workspace owned by the runner user, so
        # git would refuse with "dubious ownership"; `vite build` shells out to
        # `git rev-parse` to stamp the commit, and gh reads the remote below.
        run: git config --global --add safe.directory "$GITHUB_WORKSPACE"

      - name: Install jq and gh
        # The screenshot-reporting steps use jq and gh, which the GitHub runner
        # ships but this image does not. The image has no needrestart and apt is
        # uncontended here, so this is fast; the timeout is just a safety net.
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          apt-get update
          apt-get install -y --no-install-recommends jq
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y --no-install-recommends gh

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Run Lint
        run: pnpm lint

      - name: Run Typecheck
        run: pnpm typecheck

      - name: Install Playwright Chromium
        # Prebaked in the image; this just verifies the matching binary is present
        # (no download, no apt).
        run: pnpm exec playwright install chromium

      - name: Build
        run: pnpm build

      - name: Run Browser Tests
        id: run_tests
        run: pnpm run test --reporter=json --outputFile=test-results.json
        continue-on-error: true

      - name: Detect visual regression failures
        id: vr_check
        if: steps.run_tests.outcome == 'failure' && github.event_name == 'pull_request'
        run: |
          VR_FAILED=$(jq '[
            .testResults[].assertionResults[]
            | select(.status == "failed")
            | select(any(.failureMessages[]; contains("toMatchScreenshot")))
          ] | length > 0' test-results.json)
          echo "vr_failed=$VR_FAILED" >> $GITHUB_OUTPUT
      - name: Post VR failure comment
        if: steps.vr_check.outputs.vr_failed == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          EXISTING=$(gh pr view ${{ github.event.pull_request.number }} \
            --json comments \
            --jq '[.comments[].body | select(contains("Visual Regression Failures Detected"))] | length')

          if [ "$EXISTING" -eq 0 ]; then
            gh pr comment ${{ github.event.pull_request.number }} \
              --body "### 📸 Visual Regression Failures Detected

          Some screenshots don't match the stored references. If these changes are intentional, add the \`update screenshots\` label to this PR to update them automatically."
          fi
      - name: Fail if tests failed
        if: steps.run_tests.outcome == 'failure'
        run: exit 1

  release:
    name: Release
    needs: verify
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      pull-requests: write
      id-token: write
      deployments: write
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v6

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js 24
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Create Release Pull Request or Publish
        uses: changesets/action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          publish: pnpm release
          createGithubReleases: true
          commit: version packages

  build-demo:
    name: Build Demo
    needs: verify
    if: "(github.event_name == 'push' || github.event_name == 'workflow_dispatch') && github.ref == 'refs/heads/main'"
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      pages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build demo site
        env:
          PAGES_BASE_PATH: /${{ github.event.repository.name }}/
        run: pnpm build:demo

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist-demo

  deploy-pages:
    name: Deploy Demo To GitHub Pages
    needs: build-demo
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
