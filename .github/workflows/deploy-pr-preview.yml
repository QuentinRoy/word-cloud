name: Deploy PR Preview

on:
  pull_request:
    types: [opened, reopened, synchronize, closed]

concurrency:
  group: pr-preview-${{ github.event.pull_request.number }}
  cancel-in-progress: true

permissions:
  contents: write
  pull-requests: write
  deployments: write

jobs:
  deploy-preview:
    name: Deploy PR Preview
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v6

      - name: Set up pnpm
        if: github.event.action != 'closed'
        uses: pnpm/action-setup@v4
        with:
          run_install: false

      - name: Set up Node
        if: github.event.action != 'closed'
        uses: actions/setup-node@v6
        with:
          node-version-file: .tool-versions
          cache: pnpm

      - name: Install dependencies
        if: github.event.action != 'closed'
        run: pnpm install --frozen-lockfile

      - name: Build demo
        if: github.event.action != 'closed'
        run: pnpm run build:demo
        env:
          PAGES_BASE_PATH: /word-cloud/pr-preview/pr-${{ github.event.pull_request.number }}/

      - name: Deploy preview
        uses: rossjrw/pr-preview-action@v1
        with:
          source-dir: dist-demo
          preview-branch: gh-pages
          umbrella-dir: pr-preview
          action: auto
          comment: false
          wait-for-pages-deployment: true

      - name: Record preview deployment
        if: github.event.action != 'closed'
        uses: actions/github-script@v8
        env:
          PREVIEW_URL: https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/pr-preview/pr-${{ github.event.pull_request.number }}/
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullRequest = context.payload.pull_request;
            const environment = "pr-preview";

            const deployment = await github.rest.repos.createDeployment({
              owner,
              repo,
              ref: pullRequest.head.sha,
              environment,
              description: `Preview for PR #${pullRequest.number}`,
              payload: {
                pull_request: pullRequest.number,
                preview_path: `pr-preview/pr-${pullRequest.number}`,
              },
              auto_merge: false,
              required_contexts: [],
              transient_environment: true,
              production_environment: false,
            });

            await github.rest.repos.createDeploymentStatus({
              owner,
              repo,
              deployment_id: deployment.data.id,
              state: "success",
              environment_url: process.env.PREVIEW_URL,
              log_url: `${context.serverUrl}/${owner}/${repo}/actions/runs/${context.runId}`,
              description: "PR preview deployed",
              auto_inactive: false,
            });

      - name: Mark closed PR preview deployment inactive
        if: github.event.action == 'closed'
        uses: actions/github-script@v8
        with:
          script: |
            const { owner, repo } = context.repo;
            const pullRequest = context.payload.pull_request;
            const environment = "pr-preview";

            const deployments = await github.paginate(
              github.rest.repos.listDeployments,
              {
                owner,
                repo,
                environment,
                per_page: 100,
              },
            );

            const previewDeployments = deployments.filter(
              (deployment) =>
                deployment.payload?.pull_request === pullRequest.number,
            );

            await Promise.all(
              previewDeployments.map((deployment) =>
                github.rest.repos.createDeploymentStatus({
                  owner,
                  repo,
                  deployment_id: deployment.id,
                  state: "inactive",
                  description: "PR preview marked inactive",
                  auto_inactive: false,
                }),
              ),
            );
