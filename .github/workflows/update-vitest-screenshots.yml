name: Update Visual Regression Screenshots

on:
  pull_request:
    types: [labeled]

env:
  # TRIGGER_LABEL also need to be update in the if condition of the job and in the summary step
  # (if conditions do not support env variables, so we need to hardcode the label name there)
  TRIGGER_LABEL: update screenshots
  AUTHOR_NAME: "github-actions[bot]"
  AUTHOR_EMAIL: "41898282+github-actions[bot]@users.noreply.github.com"
  COMMIT_MESSAGE: |
    test: update visual regression screenshots

    Co-authored-by: ${{ github.actor }} <${{ github.actor_id }}+${{ github.actor }}@users.noreply.github.com>

jobs:
  update-screenshots:
    runs-on: ubuntu-24.04
    # Same Playwright image as ci.yml so the regenerated screenshots are rendered
    # in the identical environment the verify job checks them against.
    container:
      image: mcr.microsoft.com/playwright:v1.59.1-noble

    # only run when the correct label is added
    if: >
      github.event.label.name == 'update screenshots' &&
      github.event.pull_request.head.ref != github.event.repository.default_branch

    concurrency:
      group: visual-regression-screenshots@${{ github.event.pull_request.head.ref }}
      cancel-in-progress: true

    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout PR branch
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.pull_request.head.ref }}

      - name: Configure Git
        # safe.directory: the container runs as root over a runner-owned
        # workspace, so git would refuse to commit/push without it.
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config --global user.name "${{ env.AUTHOR_NAME }}"
          git config --global user.email "${{ env.AUTHOR_EMAIL }}"

      - name: Install gh
        # gh (used for the PR comment and label removal below) ships on the GitHub
        # runner but not in this image.
        timeout-minutes: 5
        env:
          DEBIAN_FRONTEND: noninteractive
        run: |
          curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
            -o /usr/share/keyrings/githubcli-archive-keyring.gpg
          chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
          echo "deb [arch=$(dpkg --print-architecture) signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] https://cli.github.com/packages stable main" \
            > /etc/apt/sources.list.d/github-cli.list
          apt-get update
          apt-get install -y --no-install-recommends gh

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Install Playwright Browsers
        # Prebaked in the image (see ci.yml); no download, no apt.
        run: pnpm exec playwright install chromium

      - name: Update Visual Regression Screenshots
        run: pnpm run test --update

      - name: Check for changes
        id: check_changes
        run: |
          CHANGED_FILES=$(git status --porcelain | awk '{print $2}')
          if [ "${CHANGED_FILES:+x}" ]; then
            echo "changes=true" >> $GITHUB_OUTPUT
            echo "Changes detected"

            echo "changed_files<<EOF" >> $GITHUB_OUTPUT
            echo "$CHANGED_FILES" >> $GITHUB_OUTPUT
            echo "EOF" >> $GITHUB_OUTPUT
            echo "changed_count=$(echo "$CHANGED_FILES" | wc -l)" >> $GITHUB_OUTPUT
          else
            echo "changes=false" >> $GITHUB_OUTPUT
            echo "No changes detected"
          fi

      - name: Commit changes
        if: steps.check_changes.outputs.changes == 'true'
        run: |
          git add -A
          git commit -m "${{ env.COMMIT_MESSAGE }}"

      - name: Push changes
        if: steps.check_changes.outputs.changes == 'true'
        run: git push origin ${{ github.event.pull_request.head.ref }}

      - name: Build summary
        id: summary
        env:
          HAS_CHANGES: ${{ steps.check_changes.outputs.changes }}
          CHANGED_COUNT: ${{ steps.check_changes.outputs.changed_count }}
          CHANGED_FILES: ${{ steps.check_changes.outputs.changed_files }}
          TRIGGER_LABEL: ${{ env.TRIGGER_LABEL }}
          HEAD_REF: ${{ github.event.pull_request.head.ref }}
        run: |
          if [[ "$HAS_CHANGES" == "true" ]]; then
            {
              echo "body<<EOF"
              echo "### 📸 Visual Regression Screenshots Updated"
              echo ""
              echo "Triggered by label: \`$TRIGGER_LABEL\`"
              echo ""
              echo "Updated **$CHANGED_COUNT** screenshot(s) on \`$HEAD_REF\`."
              echo ""
              echo "#### Changed Files:"
              echo "\`\`\`"
              printf '%s\n' "$CHANGED_FILES"
              echo "\`\`\`"
              echo ""
              echo "✅ Changes committed and pushed."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          else
            {
              echo "body<<EOF"
              echo "### ℹ️ No Screenshot Updates Required"
              echo ""
              echo "Triggered by label: \`$TRIGGER_LABEL\`"
              echo ""
              echo "All screenshots are already up to date."
              echo "EOF"
            } >> "$GITHUB_OUTPUT"
          fi

      - name: Write summary to job
        env:
          SUMMARY_BODY: ${{ steps.summary.outputs.body }}
        run: printf '%s\n' "$SUMMARY_BODY" >> "$GITHUB_STEP_SUMMARY"

      - name: Comment on PR
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          COMMENT_BODY: ${{ steps.summary.outputs.body }}
        run: |
          gh pr comment ${{ github.event.pull_request.number }} \
            --body "$COMMENT_BODY"

      - name: Remove trigger label
        if: always()
        run: |
          gh pr edit ${{ github.event.pull_request.number }} \
            --remove-label "${{ env.TRIGGER_LABEL }}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}